version: '3.8'

services:
  # Nginx Reverse Proxy & Load Balancer
  nginx:
    image: nginx:alpine
    container_name: ara_nginx_proxy
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - ai-research-assistant
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 15s
      timeout: 5s
      retries: 3

  # Main ARA Application Server Container
  ai-research-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-research-assistant:1.0.0
    container_name: ara_app_production
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=ara
      - POSTGRES_PASSWORD=ara_production_password
      - POSTGRES_DB=ara_production_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - app_production_data:/app/data
      - app_storage_data:/app/.storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/liveness"]
      interval: 15s
      timeout: 5s
      retries: 3

  # PostgreSQL Database with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ara_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ara
      POSTGRES_PASSWORD: ara_production_password
      POSTGRES_DB: ara_production_db
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ara -d ara_production_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Session Manager
  redis:
    image: redis:7-alpine
    container_name: ara_redis_prod
    restart: unless-stopped
    volumes:
      - redis_prod_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: ara_minio_prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_prod_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auto-initialize MinIO Production Buckets
  minio-init-buckets:
    image: minio/mc:latest
    container_name: ara_minio_init_prod
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb --ignore-existing myminio/ara-uploads;
      /usr/bin/mc mb --ignore-existing myminio/ara-reports;
      /usr/bin/mc mb --ignore-existing myminio/ara-datasets;
      /usr/bin/mc mb --ignore-existing myminio/ara-screenshots;
      /usr/bin/mc mb --ignore-existing myminio/ara-browser-downloads;
      /usr/bin/mc mb --ignore-existing myminio/ara-browser-uploads;
      /usr/bin/mc mb --ignore-existing myminio/ara-generated-files;
      exit 0;
      "

  # Prometheus Telemetry & Metrics Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: ara_prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  # Grafana Dashboard Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: ara_grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin_production_password
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  app_production_data:
    driver: local
  app_storage_data:
    driver: local
  postgres_prod_data:
    driver: local
  redis_prod_data:
    driver: local
  minio_prod_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

apiVersion: v1
kind: Service
metadata:
  name: ara-platform-service
spec:
  type: ClusterIP
  selector:
    app: ara-platform
  ports:
  - name: http
    port: 80
    targetPort: 8000
  - name: metrics
    port: 9090
    targetPort: 9090
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ara-platform-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  - host: ara.internal
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ara-platform-service
            port:
              number: 80

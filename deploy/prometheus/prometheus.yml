# Prometheus Scrape Configuration for ARA v1.0 Production Cluster

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'ara-production-cluster'
    environment: 'production'

scrape_configs:
  - job_name: 'ara_application'
    metrics_path: '/api/v1/evaluation/prometheus'
    scrape_interval: 10s
    static_configs:
      - targets: ['ai-research-assistant:8000', 'nginx:80']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

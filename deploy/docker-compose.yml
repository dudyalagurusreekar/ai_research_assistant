version: '3.8'

services:
  ara-platform:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ara_platform_service
    ports:
      - "8000:8000"
      - "9090:9090"
    environment:
      - ARA_ENV=production
      - SECRET_KEY=ara_enterprise_secret_key_2026
    volumes:
      - ara_tenants_data:/.tenants
      - ara_backups_data:/.backups

  prometheus:
    image: prom/prometheus:latest
    container_name: ara_prometheus
    ports:
      - "9091:9090"

volumes:
  ara_tenants_data:
  ara_backups_data:

# Nginx Reverse Proxy & Load Balancer Configuration for ARA v1.0 Production Stack

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logging format with Correlation ID & Request Latency
    log_format production_json escape=json
      '{"time_local":"$time_local",'
      '"remote_addr":"$remote_addr",'
      '"request":"$request",'
      '"status": "$status",'
      '"body_bytes_sent":"$body_bytes_sent",'
      '"request_time":"$request_time",'
      '"http_x_correlation_id":"$http_x_correlation_id",'
      '"http_user_agent":"$http_user_agent"}';

    access_log /var/log/nginx/access.log production_json;
    error_log /var/log/nginx/error.log warn;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate Limiting Zone: 10 requests/sec per IP
    limit_req_zone $binary_remote_addr zone=ara_api_limit:10m rate=10r/s;

    # Upstream App Server
    upstream ara_backend {
        server ai-research-assistant:8000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;

        # Client Upload Limit: 50MB for research documents
        client_max_body_size 50M;

        # Proxy Healthcheck location
        location /health {
            proxy_pass http://ara_backend/health;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Prometheus Metrics Scrape Endpoint (Internal/Protected)
        location /metrics {
            proxy_pass http://ara_backend/api/v1/evaluation/prometheus;
            proxy_set_header Host $host;
        }

        # Core API Endpoints
        location /api/ {
            limit_req zone=ara_api_limit burst=20 nodelay;
            proxy_pass http://ara_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Swagger Docs & OpenAPI Schema
        location /docs {
            proxy_pass http://ara_backend/docs;
            proxy_set_header Host $host;
        }
        location /openapi.json {
            proxy_pass http://ara_backend/openapi.json;
            proxy_set_header Host $host;
        }

        # Root fallback
        location / {
            proxy_pass http://ara_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}

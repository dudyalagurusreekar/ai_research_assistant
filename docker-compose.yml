version: '3.8'

services:
  # Main ARA Application Container
  ai-research-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-research-assistant:1.0.0
    container_name: ai_research_assistant_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - POSTGRES_HOST=postgres
      - REDIS_HOST=redis
      - MINIO_ENDPOINT=minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/liveness"]
      interval: 30s
      timeout: 5s
      retries: 3

  # PostgreSQL Database with pgvector Extension
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ara_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ara
      POSTGRES_PASSWORD: ara_password
      POSTGRES_DB: ara_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ara -d ara_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache & Session Manager
  redis:
    image: redis:7-alpine
    container_name: ara_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: ara_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Auto-initialize MinIO Buckets
  minio-init-buckets:
    image: minio/mc:latest
    container_name: ara_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb --ignore-existing myminio/ara-uploads;
      /usr/bin/mc mb --ignore-existing myminio/ara-reports;
      /usr/bin/mc mb --ignore-existing myminio/ara-datasets;
      /usr/bin/mc mb --ignore-existing myminio/ara-screenshots;
      /usr/bin/mc mb --ignore-existing myminio/ara-browser-downloads;
      /usr/bin/mc mb --ignore-existing myminio/ara-browser-uploads;
      /usr/bin/mc mb --ignore-existing myminio/ara-generated-files;
      /usr/bin/mc mb --ignore-existing myminio/ara-temp-assets;
      exit 0;
      "

  # Optional Administration Tools
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ara_pgadmin
    restart: unless-stopped
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ara.local
      PGADMIN_DEFAULT_PASSWORD: adminpassword
    depends_on:
      - postgres

  redisinsight:
    image: redis/redisinsight:latest
    container_name: ara_redisinsight
    restart: unless-stopped
    ports:
      - "5540:5540"
    depends_on:
      - redis

volumes:
  app_data:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
